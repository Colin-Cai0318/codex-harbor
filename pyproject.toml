[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codex-harbor"
version = "0.1.0"
description = "Local-first persistent scheduler for Codex coding tasks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Codex Harbor contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "platformdirs>=4.3,<5",
  "psutil>=6,<8",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
bundle = ["pyinstaller>=6.11,<7", "Pillow>=11,<13"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
]

[project.scripts]
harbor = "codex_harbor.cli:main"
codex-harbord = "codex_harbor.daemon:main"

[project.gui-scripts]
harbor-desktop = "codex_harbor.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_harbor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
